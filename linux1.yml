---

- name: "this is the linux code automation written in ansible"
  hosts: all
  vars:
    fname: "prince"
    path: "/home/ansible/test1.txt"
  tasks:
    - name: "print the fname"
      ansible.builtin.debug:
        msg: "{{ fname }}"
    - name: "create a file"
      ansible.builtin.copy:
        content: "hello prince misha "
        dest: "{{ path }}"

